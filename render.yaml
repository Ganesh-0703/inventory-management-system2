services:
  - type: web
    name: flashstore-darkstore-system
    env: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build:client && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

